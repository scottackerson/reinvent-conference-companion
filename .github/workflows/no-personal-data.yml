name: no-personal-data
on:
  push:
  pull_request:

jobs:
  guard:
    if: github.repository == 'scottackerson/reinvent-conference-companion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if personal or generated files are present
        run: |
          bad=$(git ls-files | grep -E '(^|/)agenda\.json$|\.pdf$|(^|/)\.vercel/|(^|/)build-private/|_plan\.md$' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be in the template repo:"
            echo "$bad"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node build.mjs --check --agenda agenda.example.json
