# Public demo: builds the fictional example agenda (agenda.example.json) and publishes it to GitHub Pages.
# It runs only in the template repository itself, never in copies made from the template, and it always
# builds the example explicitly, so a personal agenda.json can never be published by this workflow.
name: demo-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'scottackerson/reinvent-conference-companion'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the example agenda only
        run: |
          rm -f agenda.json
          node build.mjs --agenda agenda.example.json --out _site
          grep -q '"name":"Alex Example"' _site/agenda.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
